[plugin]
id = "coyote_control"
name = "郊狼控制"
description = "让猫娘根据对话情境自主控制 DG-Lab 郊狼设备"
version = "0.3.3"
entry = "plugin.plugins.coyote_control:CoyoteControlPlugin"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "dashboard"
title = "郊狼控制面板"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "quickstart"
title = "快速开始"
entry = "docs/quickstart.md"
permissions = ["state:read"]
